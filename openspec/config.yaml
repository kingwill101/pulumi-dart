schema: spec-driven

context: |
  Project: Pulumi Dart
  Goal: Deliver a first-class Pulumi language experience for Dart with parity to Pulumi Go/Python/Node where practical.

  Repository layout:
  - pulumi-language-dart/: Go implementation of the Dart Pulumi language host.
  - pulumi-dart/: Dart runtime SDK (resource model, deployment runtime, RPC bindings).
  - pulumi_generator/: Dart package generation/codegen work (currently partial).
  - integration_tests/: Go integration harness and Dart fixtures.
  - proto/: Pulumi proto sources consumed by Dart gRPC generation.
  - pulumi/: upstream Pulumi submodule for parity/reference.

  Primary tech stack:
  - Go for language host and integration harness.
  - Dart SDK >= 3.10 for runtime libraries and fixtures.
  - gRPC/protobuf for engine/monitor/provider protocol.

  Current priority themes:
  - Language host parity gaps (GetRequiredPackages, GenerateProject, GenerateProgram, Pack, Handshake, Cancel).
  - Generator flow maturity (move from minimal scaffold to schema-driven SDK generation).
  - Runtime parity gaps (resource/invoke transforms, packageRef plumbing, option forwarding like ignoreChanges).
  - Integration parity expansion against upstream test coverage.

  Execution and validation conventions:
  - Prefer atomic, scoped changes and commits.
  - Validate with targeted tests before broad suites.
  - Preserve unrelated local changes; do not revert user work.
  - Keep behavior aligned with upstream Pulumi semantics unless intentionally diverging.

  Common commands:
  - Build language host: `cd pulumi-language-dart && go build .`
  - Install host: `cd pulumi-language-dart && go install ./...`
  - Run integration tests (example): `cd integration_tests && go test -run TestEmptyDart -v .`
  - Generate Dart protobufs: `make generate`
  - Regenerate external stubs (protobuf/googleapis): `make regenerate-stubs`

rules:
  proposal:
    - State current behavior, desired behavior, and why this matters for Pulumi parity.
    - Include explicit non-goals to keep each change slice tractable.
    - List impacted repo areas using concrete paths.
    - Call out migration or compatibility risks (CLI version, protocol, generated SDKs).
  specs:
    - Use normative language (MUST/SHOULD) for runtime and language-host behavior.
    - Include at least one success scenario and one failure/edge scenario per requirement.
    - Map new requirements to existing upstream semantics when relevant (Go/Python/Node references).
    - Avoid vague requirements; each item must be testable.
  design:
    - Document tradeoffs and parity choices explicitly.
    - Define interfaces and data flow across host <-> engine/monitor and runtime <-> monitor.
    - Include rollout/backward-compatibility notes for generated SDK and protocol-facing changes.
    - Keep scope small enough for atomic implementation and review.
  tasks:
    - Break work into independently shippable vertical slices.
    - Each task must include exact verification commands and expected signal.
    - Include integration test updates whenever behavior changes.
    - End with docs/spec sync and cleanup tasks (no lingering TODO placeholders for shipped behavior).
