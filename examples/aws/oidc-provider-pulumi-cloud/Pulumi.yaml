name: ${PROJECT}
description: ${DESCRIPTION}
runtime:
  name: dart
  options:
    resolution: workspace
template:
  description: AWS OIDC setup for Pulumi ESC
  config:
    aws:region:
      description: AWS Region
      default: us-west-2
    pulumiOrganization:
      description: Pulumi organization name
    escProject:
      description: The name of the ESC project in which to place a generated environment.
      default: aws
    escEnvironmentName:
      description: The name of the ESC environment to generate.
      default: aws-oidc-admin
