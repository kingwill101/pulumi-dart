name: aws-dart-console-slack-notification
runtime:
  name: dart
  options:
    resolution: workspace
description: Deploy necessary resources to notify Slack when an operation is performed via the AWS Console.
template:
  config:
    aws:region:
      description: The AWS region to deploy into
      default: us-east-1
    slackWebhookURL:
      description: Slack incoming webhook URL
    slackMessageUsername:
      description: Optional Slack username for bot message
      default: Console Change Monitor
    slackMessageText:
      description: Optional Slack message text
      default: ":warning: Somebody made a change in the console!"
    trailObjectExpirationInDays:
      description: Optional CloudTrail S3 object expiration in days
      default: "0"
