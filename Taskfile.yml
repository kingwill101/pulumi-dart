version: "3"

vars:
  ROOT_DIR: "{{.TASKFILE_DIR}}"
  PACKAGES_DIR: "{{.ROOT_DIR}}/packages"
  SDKS_DIR: "{{.PACKAGES_DIR}}/sdks"
  SCHEMAS_DIR: "{{.PACKAGES_DIR}}/sdks/schemas"
  GEN_PROJECT_DIR: "{{.ROOT_DIR}}/.gen/sdk-gen"
  SMOKE_DIR: "{{.ROOT_DIR}}/.gen/smoke"
  ANALYSIS_DIR: "{{.PACKAGES_DIR}}/analysis"
  LANGUAGE_HOST_DIR: "{{.ROOT_DIR}}/pulumi-language-dart"
  PULUMI_DART_PATH: "{{.ROOT_DIR}}/packages/pulumi-dart"
  DEFAULT_PULUMI_CONFIG_PASSPHRASE: "banana"
  SMOKE_STACK_PREFIX: "dev"
  PRESERVE_EXAMPLES: "true"
  FORMAT_GENERATED: "true"
  STRICT_FORMAT: "false"
  ANALYZE_FAIL_ON_ISSUES: "false"
  COVERAGE_LCOV: ""
  COVERAGE_EXCLUDE_FILE: "{{.ROOT_DIR}}/.coverage_filter"
  DART_COVERAGE_BASELINE: "29.27"
  DAY1_PROVIDERS: "gcp google-native"
  ALL_PROVIDERS: "gcp google-native aws awsx random"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  proto:generate:
    desc: Regenerate pulumirpc Dart files from pulumi/proto (clones pulumi/ if missing)
    cmds:
      - make generate

  test:mutation:dry:
    desc: Dry-run mutation testing config for pulumi-dart (counts candidate mutants only)
    cmds:
      - |
        set -eu
        cd "{{.PULUMI_DART_PATH}}"
        rm -rf mutation-test-report
        if ! dart run mutation_test --dry mutation-test.xml; then
          echo "mutation_test dry run completed; non-zero exit is expected because no tests are executed in dry mode."
        fi

  test:mutation:dry:coverage:
    desc: Dry-run mutation testing using lcov data to highlight uncovered mutants
    cmds:
      - task: test:coverage
      - |
        set -eu
        cd "{{.PULUMI_DART_PATH}}"
        rm -rf mutation-test-report
        if ! dart run mutation_test --dry --coverage coverage/lcov.info mutation-test.xml; then
          echo "mutation_test dry run with coverage completed; non-zero exit is expected in dry mode."
        fi

  test:coverage:
    desc: Generate lcov coverage report for pulumi-dart tests
    cmds:
      - |
        set -eu
        cd "{{.PULUMI_DART_PATH}}"
        mkdir -p coverage
        EXCLUDE_FILE="{{.COVERAGE_EXCLUDE_FILE}}"

        set +e
        dart test --coverage-path=coverage/lcov.info --coverage-package='^pulumi$'
        TEST_EXIT_CODE=$?
        set -e

        if [ -f "${EXCLUDE_FILE}" ]; then
          awk -v filter_file="${EXCLUDE_FILE}" '
            BEGIN {
              n = 0
              while ((getline line < filter_file) > 0) {
                gsub(/^[[:space:]]+|[[:space:]]+$/, "", line)
                if (line == "" || substr(line, 1, 1) == "#") {
                  continue
                }
                filters[++n] = line
              }
            }
            /^SF:/ {
              skip_file = 0
              for (i = 1; i <= n; i++) {
                if (index($0, filters[i]) > 0) {
                  skip_file = 1
                  break
                }
              }
            }
            !skip_file
          ' coverage/lcov.info > coverage/lcov.filtered.info
        else
          cp coverage/lcov.info coverage/lcov.filtered.info
        fi

        if [ ${TEST_EXIT_CODE} -ne 0 ]; then
          echo "Dart tests failed with status ${TEST_EXIT_CODE}. Coverage report: {{.PULUMI_DART_PATH}}/coverage/lcov.filtered.info"
          exit ${TEST_EXIT_CODE}
        fi

        echo "Coverage report: {{.PULUMI_DART_PATH}}/coverage/lcov.filtered.info"

  test:coverage:ratchet:
    desc: Enforce non-regression against the Dart coverage baseline
    cmds:
      - task: test:coverage
      - |
        set -eu
        LCOV_PATH="{{.PULUMI_DART_PATH}}/coverage/lcov.filtered.info"
        BASELINE="{{.DART_COVERAGE_BASELINE}}"
        ACTUAL="$(awk -F: '/^LF:/{lf+=$2}/^LH:/{lh+=$2} END{if (lf==0) {print "0.00"} else {printf "%.2f", (100*lh/lf)}}' "${LCOV_PATH}")"
        echo "Coverage baseline: ${BASELINE}%"
        echo "Coverage actual:   ${ACTUAL}%"
        awk -v actual="${ACTUAL}" -v baseline="${BASELINE}" 'BEGIN { exit(actual + 0 < baseline + 0) }'

  test:mutation:
    desc: Run mutation testing for pulumi-dart core runtime surface
    cmds:
      - |
        set -eu
        cd "{{.PULUMI_DART_PATH}}"
        rm -rf mutation-test-report
        INPUT_COVERAGE="{{.COVERAGE_LCOV}}"
        DEFAULT_COVERAGE="{{.PULUMI_DART_PATH}}/coverage/lcov.filtered.info"
        if [ -z "${INPUT_COVERAGE}" ] && [ -f "${DEFAULT_COVERAGE}" ]; then
          INPUT_COVERAGE="${DEFAULT_COVERAGE}"
        fi

        if [ -n "${INPUT_COVERAGE}" ]; then
          echo "Using coverage file: ${INPUT_COVERAGE}"
          dart run mutation_test --coverage "${INPUT_COVERAGE}" mutation-test.xml
        else
          dart run mutation_test mutation-test.xml
        fi

  test:mutation:coverage:
    desc: Generate coverage then run mutation testing using that lcov report
    cmds:
      - task: test:coverage
      - task: test:mutation
        vars:
          COVERAGE_LCOV: "{{.PULUMI_DART_PATH}}/coverage/lcov.info"

  parity:audit:
    desc: Compare Dart integration test surface against upstream Go/Node/Python tests
    cmds:
      - dart run repodoc parity:integration

  parity:audit:sdk:
    desc: Compare Dart core test surface against upstream NodeJS/Python SDK test topics
    cmds:
      - dart run repodoc parity:sdk

  check:workspace:
    desc: Validate workspace pubspec conventions
    cmds:
      - dart run repodoc packages:check-workspace

  check:schema-drift:
    desc: Check upstream provider schema drift
    cmds:
      - dart run repodoc schema:check

  generate:packages:
    desc: Regenerate provider packages from packages/sdks/schema_sources.json
    cmds:
      - dart run repodoc packages:generate

  check-tools:
    desc: Verify required tooling for SDK generation
    cmds:
      - dart run repodoc tools:check

  setup:
    desc: Prepare directories and build pulumi-language-dart
    deps:
      - check-tools
      - prepare-dirs
      - build-language-host

  prepare-dirs:
    desc: Create packages workspace directories
    cmds:
      - mkdir -p "{{.PACKAGES_DIR}}" "{{.SCHEMAS_DIR}}" "{{.GEN_PROJECT_DIR}}" "{{.ANALYSIS_DIR}}"

  clean:layout:
    desc: Remove legacy generation layout directories under packages/
    cmds:
      - rm -rf "{{.PACKAGES_DIR}}/projects" "{{.PACKAGES_DIR}}/sdk-gen"

  build-language-host:
    desc: Build pulumi-language-dart binary used by `pulumi package add`
    deps:
      - check-tools
    dir: "{{.LANGUAGE_HOST_DIR}}"
    cmds:
      - go build -o pulumi-language-dart .

  init-project:
    internal: true
    deps:
      - prepare-dirs
    cmds:
      - |
        set -eu
        PROJECT_DIR="{{.GEN_PROJECT_DIR}}"
        mkdir -p "${PROJECT_DIR}"
        LOCAL_OVERRIDES=""
        for PKG_PUBSPEC in "{{.SDKS_DIR}}"/*/pubspec.yaml; do
          [ -f "${PKG_PUBSPEC}" ] || continue
          PKG_NAME="$(sed -n 's/^name:[[:space:]]*//p' "${PKG_PUBSPEC}" | head -n 1)"
          [ -n "${PKG_NAME}" ] || continue
          if [ "${PKG_NAME}" = "pulumi" ]; then
            continue
          fi
          PKG_DIR="$(dirname "${PKG_PUBSPEC}")"
          LOCAL_OVERRIDES="${LOCAL_OVERRIDES}
          ${PKG_NAME}:
            path: ${PKG_DIR}"
        done

        cat > "${PROJECT_DIR}/Pulumi.yaml" <<EOF
        name: dart-sdk-gen
        runtime: dart
        description: Pulumi Dart SDK generation workspace
        EOF

        cat > "${PROJECT_DIR}/pubspec.yaml" <<EOF
        name: dart_sdk_gen
        description: Pulumi Dart SDK generation workspace
        version: 0.0.1
        environment:
          sdk: ">=3.11.0 <4.0.0"
        dependencies:
          pulumi: any
        dependency_overrides:
          pulumi:
            path: {{.PULUMI_DART_PATH}}
        ${LOCAL_OVERRIDES}
        EOF

        (cd "${PROJECT_DIR}" && dart pub get)

  fetch-schema:
    internal: true
    requires:
      vars:
        - PACKAGE
        - SCHEMA_URL
    deps:
      - check-tools
      - prepare-dirs
    cmds:
      - |
        set -eu
        PACKAGE="{{.PACKAGE}}"
        SCHEMA_PATH="{{.SCHEMAS_DIR}}/${PACKAGE}.schema.json"
        curl -fsSL "{{.SCHEMA_URL}}" -o "${SCHEMA_PATH}"
        echo "Saved ${SCHEMA_PATH}"
        echo "Schema package: $(jq -r '.name + "@" + .version' "${SCHEMA_PATH}")"

  generate-package:
    internal: true
    requires:
      vars:
        - PACKAGE
    cmds:
      - dart run repodoc packages:generate --provider "{{.PACKAGE}}"

  generate:provider:
    desc: Generate Dart SDK for a provider package from Pulumi Registry
    requires:
      vars:
        - PACKAGE
    cmds:
      - task: generate-package
        vars:
          PACKAGE: "{{.PACKAGE}}"

  generate:gcp:
    desc: Generate Dart SDK for Pulumi GCP
    cmds:
      - task: generate:provider
        vars:
          PACKAGE: gcp

  generate:google-native:
    desc: Generate Dart SDK for Pulumi Google Native
    cmds:
      - task: generate:provider
        vars:
          PACKAGE: google-native

  generate:aws:
    desc: Generate Dart SDK for Pulumi AWS
    cmds:
      - task: generate:provider
        vars:
          PACKAGE: aws

  generate:awsx:
    desc: Generate Dart SDK for Pulumi AWSX
    cmds:
      - task: generate:provider
        vars:
          PACKAGE: awsx

  generate:random:
    desc: Generate Dart SDK for Pulumi Random
    cmds:
      - task: generate:provider
        vars:
          PACKAGE: random

  generate:terraform:
    desc: Generate Dart SDK for Pulumi Terraform
    cmds:
      - task: generate:provider
        vars:
          PACKAGE: terraform

  generate:all:
    desc: Generate all configured provider SDKs for Dart
    cmds:
      - dart run repodoc packages:generate

  generate:day1:
    desc: Generate Day 1 Google provider SDKs for Dart
    cmds:
      - dart run repodoc packages:generate --provider "gcp,google-native"

  analyze-package:
    internal: true
    requires:
      vars:
        - PACKAGE
    cmds:
      - |
        set -eu
        PACKAGE="{{.PACKAGE}}"
        SDK_DIR="{{.SDKS_DIR}}/${PACKAGE}"
        REPORT_PATH="{{.ANALYSIS_DIR}}/${PACKAGE}.analyze.machine.txt"
        REPORT_EXIT_PATH="${REPORT_PATH}.exitcode"
        OVERRIDES_PATH="${SDK_DIR}/pubspec_overrides.yaml"
        ORIGINAL_OVERRIDES=""
        ANALYZE_FAIL_ON_ISSUES="{{.ANALYZE_FAIL_ON_ISSUES}}"

        if [ ! -f "${SDK_DIR}/pubspec.yaml" ]; then
          echo "SDK not found at ${SDK_DIR}" >&2
          echo "Run: task generate:${PACKAGE}" >&2
          exit 1
        fi

        if [ -f "${OVERRIDES_PATH}" ]; then
          ORIGINAL_OVERRIDES="$(mktemp)"
          cp "${OVERRIDES_PATH}" "${ORIGINAL_OVERRIDES}"
        fi

        cleanup() {
          if [ -n "${ORIGINAL_OVERRIDES}" ]; then
            cp "${ORIGINAL_OVERRIDES}" "${OVERRIDES_PATH}"
            rm -f "${ORIGINAL_OVERRIDES}"
          else
            rm -f "${OVERRIDES_PATH}"
          fi
        }
        trap cleanup EXIT

        cat > "${OVERRIDES_PATH}" <<EOF
        dependency_overrides:
          pulumi:
            path: {{.PULUMI_DART_PATH}}
        EOF

        mkdir -p "{{.ANALYSIS_DIR}}"
        (
          cd "${SDK_DIR}" && \
          dart pub get
          set +e
          dart analyze --format machine . > "${REPORT_PATH}"
          ANALYZE_EXIT="$?"
          set -e
          printf '%s\n' "${ANALYZE_EXIT}" > "${REPORT_EXIT_PATH}"
        )

        TOTAL="$(grep -cE '^(ERROR|WARNING|INFO)\\|' "${REPORT_PATH}" || true)"
        ANALYZE_EXIT="$(cat "${REPORT_EXIT_PATH}" 2>/dev/null || printf '0')"
        echo "Analysis report: ${REPORT_PATH}"
        echo "Analyzer exit code: ${ANALYZE_EXIT}"
        echo "Total issues: ${TOTAL}"
        echo "Top issue codes:"
        awk -F'|' '/^(ERROR|WARNING|INFO)\|/ { counts[$3]++ } END { for (code in counts) print counts[code], code }' "${REPORT_PATH}" \
          | sort -nr \
          | head -n 20 \
          | awk '{ printf "  %s %s\n", $1, $2 }'

        if [ "${ANALYZE_FAIL_ON_ISSUES}" = "true" ] && [ "${TOTAL}" -gt 0 ]; then
          echo "Analyzer strict mode: failing because issues were found in ${PACKAGE}." >&2
          exit 1
        fi

  analyze:gcp:
    desc: Analyze generated Dart SDK for Pulumi GCP
    cmds:
      - task: analyze-package
        vars:
          PACKAGE: gcp

  analyze:google-native:
    desc: Analyze generated Dart SDK for Pulumi Google Native
    cmds:
      - task: analyze-package
        vars:
          PACKAGE: google-native

  analyze:aws:
    desc: Analyze generated Dart SDK for Pulumi AWS
    cmds:
      - task: analyze-package
        vars:
          PACKAGE: aws

  analyze:awsx:
    desc: Analyze generated Dart SDK for Pulumi AWSX
    cmds:
      - task: analyze-package
        vars:
          PACKAGE: awsx

  analyze:random:
    desc: Analyze generated Dart SDK for Pulumi Random
    cmds:
      - task: analyze-package
        vars:
          PACKAGE: random

  analyze:terraform:
    desc: Analyze generated Dart SDK for Pulumi Terraform
    cmds:
      - task: analyze-package
        vars:
          PACKAGE: terraform

  verify:gcp:
    desc: Generate and analyze Pulumi GCP Dart SDK
    cmds:
      - task: generate:gcp
      - task: analyze:gcp

  verify:terraform:
    desc: Generate, analyze, and smoke-preview Pulumi Terraform Dart SDK
    cmds:
      - task: generate:terraform
      - task: analyze:terraform
      - task: smoke:preview
        vars:
          PACKAGE: terraform

  verify:matrix:
    desc: Generate all providers, analyze random/aws/gcp, then run smoke previews for random/aws/gcp
    cmds:
      - task: generate:all
      - |
        set -eu
        for provider in random aws gcp; do
          task "analyze:${provider}" ANALYZE_FAIL_ON_ISSUES=true
        done
      - task: smoke:preview:matrix

  smoke:init:
    desc: Create/update a local Pulumi Dart smoke project using a generated provider SDK via path dependencies
    requires:
      vars:
        - PACKAGE
    cmds:
      - task: generate:provider
        vars:
          PACKAGE: "{{.PACKAGE}}"
      - |
        set -eu
        PACKAGE="{{.PACKAGE}}"
        PACKAGE_UNDERSCORE="$(printf '%s' "${PACKAGE}" | tr '-' '_')"
        PROVIDER_PACKAGE="pulumi_${PACKAGE_UNDERSCORE}"
        PROJECT_NAME="smoke_${PACKAGE_UNDERSCORE}"
        PROJECT_DIR="{{.SMOKE_DIR}}/${PACKAGE}"
        ENTRYPOINT="smoke_${PACKAGE_UNDERSCORE}.dart"

        mkdir -p "${PROJECT_DIR}/bin"

        cat > "${PROJECT_DIR}/Pulumi.yaml" <<EOF
        name: smoke-${PACKAGE}
        runtime: dart
        description: Local smoke test for ${PROVIDER_PACKAGE}
        EOF

        cat > "${PROJECT_DIR}/pubspec.yaml" <<EOF
        name: ${PROJECT_NAME}
        publish_to: none
        version: 0.0.1
        environment:
          sdk: ">=3.11.0 <4.0.0"
        dependencies:
          pulumi: any
          ${PROVIDER_PACKAGE}:
            path: {{.SDKS_DIR}}/${PACKAGE}
        dependency_overrides:
          pulumi:
            path: {{.PULUMI_DART_PATH}}
        EOF

        if [ "${PACKAGE}" = "random" ]; then
          cat > "${PROJECT_DIR}/bin/${ENTRYPOINT}" <<EOF
        import 'package:pulumi/pulumi.dart';
        import 'package:${PROVIDER_PACKAGE}/${PROVIDER_PACKAGE}.dart' as provider;

        class SmokeStack extends Stack {
          SmokeStack() {
            final pet = provider.RandomPet(
              'smoke-pet',
              args: provider.RandomPetArgs(length: Input.fromValue(2)),
            );

            registerOutputs({
              'petName': pet.id,
            });
          }
        }

        Future<void> main() async {
          await Deployment.run(() => SmokeStack());
        }
        EOF
        else
          cat > "${PROJECT_DIR}/bin/${ENTRYPOINT}" <<EOF
        // ignore_for_file: unused_import
        import 'package:pulumi/pulumi.dart';
        import 'package:${PROVIDER_PACKAGE}/${PROVIDER_PACKAGE}.dart' as provider;

        class SmokeStack extends Stack {
          SmokeStack();
        }

        Future<void> main() async {
          await Deployment.run(() => SmokeStack());
        }
        EOF
        fi

        (cd "${PROJECT_DIR}" && dart pub get)

        echo "Smoke project ready: ${PROJECT_DIR}"
        echo "Preferred: task smoke:preview PACKAGE=${PACKAGE}"
        echo "Also available: task smoke:exec PACKAGE=${PACKAGE} CMD='pulumi about'"

  smoke:exec:
    desc: Run any shell command in a smoke project with Pulumi Dart env configured
    requires:
      vars:
        - PACKAGE
        - CMD
    cmds:
      - task: smoke:init
        vars:
          PACKAGE: "{{.PACKAGE}}"
      - |
        set -eu
        PROJECT_DIR="{{.SMOKE_DIR}}/{{.PACKAGE}}"
        (
          cd "${PROJECT_DIR}" && \
          export PATH="{{.LANGUAGE_HOST_DIR}}:${PATH}" && \
          if [ -z "${PULUMI_CONFIG_PASSPHRASE:-}" ] && [ -z "${PULUMI_CONFIG_PASSPHRASE_FILE:-}" ]; then
            export PULUMI_CONFIG_PASSPHRASE="{{.DEFAULT_PULUMI_CONFIG_PASSPHRASE}}"
          fi && \
          STACK_HASH="$(
            if command -v shasum >/dev/null 2>&1; then
              printf '%s' "${PULUMI_CONFIG_PASSPHRASE}" | shasum | awk '{print substr($1,1,8)}'
            else
              printf '%s' "${PULUMI_CONFIG_PASSPHRASE}" | sha1sum | awk '{print substr($1,1,8)}'
            fi
          )" && \
          export SMOKE_STACK_NAME="{{.SMOKE_STACK_PREFIX}}-${STACK_HASH}" && \
          CMD='{{.CMD}}' && \
          sh -c "${CMD}"
        )

  smoke:stack:
    desc: Ensure `dev` stack exists/selected for a smoke project
    requires:
      vars:
        - PACKAGE
    cmds:
      - task: smoke:exec
        vars:
          PACKAGE: "{{.PACKAGE}}"
          CMD: "pulumi stack select ${SMOKE_STACK_NAME} --create --non-interactive >/dev/null"

  smoke:preview:
    desc: Run Pulumi preview for a local smoke project wired to generated provider SDK path dependencies
    requires:
      vars:
        - PACKAGE
    cmds:
      - task: smoke:exec
        vars:
          PACKAGE: "{{.PACKAGE}}"
          CMD: "pulumi stack select ${SMOKE_STACK_NAME} --create --non-interactive >/dev/null && pulumi preview --non-interactive"

  smoke:up:
    desc: Run Pulumi up for a local smoke project wired to generated provider SDK path dependencies
    requires:
      vars:
        - PACKAGE
    cmds:
      - task: smoke:exec
        vars:
          PACKAGE: "{{.PACKAGE}}"
          CMD: "pulumi stack select ${SMOKE_STACK_NAME} --create --non-interactive >/dev/null && pulumi up --yes --non-interactive"

  smoke:preview:matrix:
    desc: Run smoke preview for random/aws/gcp generated provider SDKs
    cmds:
      - |
        set -eu
        for provider in random aws gcp; do
          task smoke:preview PACKAGE="${provider}"
        done

  project:use-local-provider:
    desc: Wire an existing Pulumi Dart project to a locally generated provider SDK and local pulumi-dart
    requires:
      vars:
        - PROJECT_DIR
        - PACKAGE
    cmds:
      - |
        set -eu
        PROJECT_DIR="{{.PROJECT_DIR}}"
        PACKAGE="{{.PACKAGE}}"
        PACKAGE_UNDERSCORE="$(printf '%s' "${PACKAGE}" | tr '-' '_')"
        PROVIDER_PACKAGE="pulumi_${PACKAGE_UNDERSCORE}"
        PROVIDER_DIR="{{.SDKS_DIR}}/${PACKAGE}"
        PULUMI_DIR="{{.PULUMI_DART_PATH}}"

        if [ ! -d "${PROJECT_DIR}" ]; then
          echo "Project directory not found: ${PROJECT_DIR}" >&2
          exit 1
        fi
        if [ ! -f "${PROJECT_DIR}/pubspec.yaml" ]; then
          echo "Expected pubspec.yaml in project directory: ${PROJECT_DIR}" >&2
          exit 1
        fi

        if [ ! -f "${PROVIDER_DIR}/pubspec.yaml" ]; then
          echo "Generated provider SDK not found at ${PROVIDER_DIR}" >&2
          echo "Run: task generate:provider PACKAGE=${PACKAGE}" >&2
          exit 1
        fi

        dart pub add -C "${PROJECT_DIR}" "${PROVIDER_PACKAGE}:{path: ${PROVIDER_DIR}}"
        dart pub add -C "${PROJECT_DIR}" "override:pulumi:{path: ${PULUMI_DIR}}"
        dart pub get -C "${PROJECT_DIR}"

        echo "Local provider wiring complete."
        echo "Project: ${PROJECT_DIR}"
        echo "Provider package: ${PROVIDER_PACKAGE} -> ${PROVIDER_DIR}"
        echo "Pulumi override: pulumi -> ${PULUMI_DIR}"

  list:schemas:
    desc: Print downloaded schema package names and versions
    cmds:
      - |
        set -eu
        if [ ! -d "{{.SCHEMAS_DIR}}" ]; then
          exit 0
        fi
        find "{{.SCHEMAS_DIR}}" -maxdepth 1 -type f -name '*.schema.json' | sort | while read -r schema; do
          printf "%s -> %s\n" "$(basename "${schema}")" "$(jq -r '.name + "@" + .version' "${schema}")"
        done
