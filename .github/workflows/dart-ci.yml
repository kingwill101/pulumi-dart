name: Dart CI

on:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  dart-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Ensure pulumi submodule checkout
        run: git submodule update --init --recursive

      - name: Validate repository workspace pubspec
        run: ./scripts/check-packages-workspace.sh

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Check toolchain versions
        run: |
          go version
          dart --version
          pulumi version

      - name: Build Dart language host
        run: |
          cd pulumi-language-dart
          go build -o pulumi-language-dart .

      - name: Install Dart language host for SDK generation
        run: |
          cd pulumi-language-dart
          go install .
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Regenerate provider SDK packages
        run: dart run tool/generate_packages.dart --all

      - name: Verify provider packages are up to date
        run: git diff --exit-code -- packages

      - name: Test Dart language host
        run: |
          cd pulumi-language-dart
          go test -count=1 ./...

      - name: Install Dart SDK package dependencies
        run: |
          cd packages/sdks/pulumi-dart
          dart pub get

      - name: Analyze Dart SDK package
        run: |
          cd packages/sdks/pulumi-dart
          dart analyze

      - name: Run Dart SDK package tests
        run: |
          cd packages/sdks/pulumi-dart
          dart test

  proto-regeneration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Ensure pulumi submodule checkout
        run: git submodule update --init --recursive

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Install protoc and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler make git
          dart pub global activate protoc_plugin 25.0.0
          echo "${HOME}/.pub-cache/bin" >> "${GITHUB_PATH}"
          protoc --version
          pulumi version

      - name: Regenerate protobuf stubs
        run: make generate

      - name: Verify protobuf stubs are up to date
          run: git diff --exit-code -- packages/sdks/pulumi-dart/lib/src/pulumirpc

  website-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build docs website
        run: |
          cd website
          npm ci
          npm run build

  dart-integration-tests:
    name: Dart integration tests (core)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard-index: [0, 1, 2, 3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure pulumi submodule checkout
        run: git submodule update --init --recursive

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Check toolchain versions
        run: |
          go version
          dart --version
          node --version
          npm --version
          python --version
          uv --version

      - name: Build Dart language host
        run: |
          cd pulumi-language-dart
          go build -o pulumi-language-dart .

      - name: Resolve shard test regex
        id: shard
        shell: bash
        run: |
          cd integration_tests
          declare -A cloud_only_tests=(
            [TestEnvironmentsBasicDart]=1
            [TestEnvironmentsMergeDart]=1
            [TestTracePropagationDart]=1
            [TestAutomationEnvironmentManagementDart]=1
            [TestAutomationRemoteWorkspaceLifecycleDart]=1
            [TestPolicyPublishEnableDisableDart]=1
          )

          mapfile -t all_tests < <(go test -list . . | grep '^Test' | sort)
          tests=()
          for test_name in "${all_tests[@]}"; do
            if [[ -z "${cloud_only_tests[$test_name]+x}" ]]; then
              tests+=("${test_name}")
            fi
          done

          total="${#tests[@]}"
          echo "Found ${total} core Dart integration tests"

          selected=()
          for i in "${!tests[@]}"; do
            if (( i % 4 == ${{ matrix.shard-index }} )); then
              selected+=("${tests[$i]}")
            fi
          done

          if [ "${#selected[@]}" -eq 0 ]; then
            echo "regex=^$" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          regex="^($(IFS='|'; echo "${selected[*]}"))$"
          echo "regex=${regex}" >> "$GITHUB_OUTPUT"
          printf 'Shard %s tests:\n' "${{ matrix.shard-index }}"
          printf '%s\n' "${selected[@]}"

      - name: Run Dart integration shard
        run: |
          cd integration_tests
          go test -count=1 -run "${{ steps.shard.outputs.regex }}" -v .

  dart-integration-tests-cloud:
    name: Dart integration tests (cloud-only)
    if: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Load cloud test secrets from 1Password
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          PULUMI_ACCESS_TOKEN: "op://devops/pulumi token/credential"

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure pulumi submodule checkout
        run: git submodule update --init --recursive

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Pulumi CLI
        uses: pulumi/actions@v5

      - name: Check toolchain versions
        run: |
          go version
          dart --version
          node --version
          npm --version
          python --version
          uv --version

      - name: Build Dart language host
        run: |
          cd pulumi-language-dart
          go build -o pulumi-language-dart .

      - name: Resolve cloud-only test regex
        id: cloud
        shell: bash
        run: |
          cd integration_tests
          mapfile -t all_tests < <(go test -list . . | grep '^Test' | sort)
          wanted=(
            TestEnvironmentsBasicDart
            TestEnvironmentsMergeDart
            TestTracePropagationDart
            TestAutomationEnvironmentManagementDart
            TestAutomationRemoteWorkspaceLifecycleDart
            TestPolicyPublishEnableDisableDart
          )

          selected=()
          for wanted_test in "${wanted[@]}"; do
            if printf '%s\n' "${all_tests[@]}" | grep -qx "${wanted_test}"; then
              selected+=("${wanted_test}")
            fi
          done

          if [ "${#selected[@]}" -eq 0 ]; then
            echo "No cloud-only integration tests were discovered."
            exit 1
          fi

          regex="^($(IFS='|'; echo "${selected[*]}"))$"
          echo "regex=${regex}" >> "$GITHUB_OUTPUT"
          printf 'Cloud-only tests:\n'
          printf '%s\n' "${selected[@]}"

      - name: Run cloud-only integration tests
        run: |
          cd integration_tests
          go test -count=1 -run "${{ steps.cloud.outputs.regex }}" -v .

  check-pr:
    needs: [dart-unit-tests, proto-regeneration, website-docs, dart-integration-tests, dart-integration-tests-cloud]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Dart unit tests failed
        if: ${{ needs.dart-unit-tests.result != 'success' }}
        run: exit 1
      - name: Proto regeneration check failed
        if: ${{ needs.proto-regeneration.result != 'success' }}
        run: exit 1
      - name: Website docs build failed
        if: ${{ needs.website-docs.result != 'success' }}
        run: exit 1
      - name: Dart integration tests failed
        if: ${{ needs.dart-integration-tests.result != 'success' }}
        run: exit 1
      - name: Cloud integration tests failed
        if: ${{ needs.dart-integration-tests-cloud.result != 'success' && needs.dart-integration-tests-cloud.result != 'skipped' }}
        run: exit 1
      - name: CI succeeded
        run: exit 0
