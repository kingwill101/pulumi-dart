name: Dart CI

on:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PULUMI_VERSION: 3.225.1

jobs:
  dart-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.0

      - name: Checkout required Pulumi submodule
        run: git submodule update --init --depth 1 thirdparty/pulumi

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version "${PULUMI_VERSION}"
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Check toolchain versions
        run: |
          go version
          dart --version
          pulumi version

      - name: Install Dart language host
        run: |
          cd pulumi-language-dart
          go install .
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Determine provider SDK regeneration scope
        id: provider-scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "${{ github.event_name }}" != "pull_request" ]]; then
            echo "arguments=" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Generator changes must remain reproducible across the whole catalog.
          if git diff --quiet "$BASE_SHA" HEAD -- \
            pulumi-language-dart/pkg/codegen/dart \
            repodoc/lib/src/commands/packages; then
            arguments=()
            while IFS= read -r schema; do
              [[ -f "$schema" ]] || continue
              provider="${schema##*/}"
              provider="${provider%.schema.json}"
              arguments+=(--provider "$provider")
            done < <(
              git diff --name-only "$BASE_SHA" HEAD -- \
                'packages/sdks/schemas/*.schema.json'
            )

            if (( ${#arguments[@]} == 0 )); then
              echo "run=false" >> "$GITHUB_OUTPUT"
            else
              printf -v quoted_arguments '%q ' "${arguments[@]}"
              echo "arguments=$quoted_arguments" >> "$GITHUB_OUTPUT"
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "arguments=" >> "$GITHUB_OUTPUT"
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate provider SDK packages
        if: steps.provider-scope.outputs.run == 'true'
        run: dart run repodoc packages:generate ${{ steps.provider-scope.outputs.arguments }}

      - name: Verify provider packages are up to date
        if: steps.provider-scope.outputs.run == 'true'
        run: dart run repodoc packages:verify-generated

      - name: Test Dart language host
        run: |
          cd pulumi-language-dart
          go test -count=1 -skip '^TestLanguageConformance$' ./...

      - name: Install Dart SDK package dependencies
        run: |
          cd packages/pulumi-dart
          dart pub get

      - name: Analyze Dart SDK package
        run: |
          cd packages/pulumi-dart
          dart analyze

      - name: Run Dart SDK package tests
        run: |
          cd packages/pulumi-dart
          dart test

  proto-regeneration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.0

      - name: Checkout required Pulumi submodule
        run: git submodule update --init --depth 1 thirdparty/pulumi

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version "${PULUMI_VERSION}"
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Install protoc and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler make git
          dart pub global activate protoc_plugin 25.0.0
          echo "${HOME}/.pub-cache/bin" >> "${GITHUB_PATH}"
          protoc --version
          pulumi version

      - name: Regenerate protobuf stubs
        run: make generate

      - name: Verify protobuf stubs are up to date
        run: git diff --exit-code -- packages/pulumi-dart/lib/src/pulumirpc

  website-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build docs website
        run: |
          cd website
          npm ci
          npm run build

  check-pr:
    if: always()
    runs-on: ubuntu-latest
    needs:
      - dart-unit-tests
      - proto-regeneration
      - website-docs
    steps:
      - name: Dart unit tests failed
        if: needs.dart-unit-tests.result != 'success'
        run: exit 1

      - name: Proto regeneration check failed
        if: needs.proto-regeneration.result != 'success'
        run: exit 1

      - name: Website docs build failed
        if: needs.website-docs.result != 'success'
        run: exit 1

      - name: CI succeeded
        run: echo "Core Dart CI succeeded."
