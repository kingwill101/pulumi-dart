name: Dart CI

on:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PULUMI_VERSION: 3.225.1

jobs:
  dart-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.0

      - name: Ensure pulumi submodule checkout
        run: git submodule update --init --recursive

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version "${PULUMI_VERSION}"
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Check toolchain versions
        run: |
          go version
          dart --version
          pulumi version

      - name: Install Dart language host
        run: |
          cd pulumi-language-dart
          go install .
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Regenerate provider SDK packages
        run: dart run tool/generate_packages.dart --all

      - name: Verify provider packages are up to date
        run: git diff --exit-code -- packages

      - name: Test Dart language host
        run: |
          cd pulumi-language-dart
          go test -count=1 ./...

      - name: Install Dart SDK package dependencies
        run: |
          cd packages/pulumi-dart
          dart pub get

      - name: Analyze Dart SDK package
        run: |
          cd packages/pulumi-dart
          dart analyze

      - name: Run Dart SDK package tests
        run: |
          cd packages/pulumi-dart
          dart test

  proto-regeneration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.0

      - name: Ensure pulumi submodule checkout
        run: git submodule update --init --recursive

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version "${PULUMI_VERSION}"
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Install protoc and dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler make git
          dart pub global activate protoc_plugin 25.0.0
          echo "${HOME}/.pub-cache/bin" >> "${GITHUB_PATH}"
          protoc --version
          pulumi version

      - name: Regenerate protobuf stubs
        run: make generate

      - name: Verify protobuf stubs are up to date
        run: git diff --exit-code -- packages/pulumi-dart/lib/src/pulumirpc

  website-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Build docs website
        run: |
          cd website
          npm ci
          npm run build

  dart-integration-tests:
    name: Dart integration tests (core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure pulumi submodule checkout
        run: git submodule update --init --recursive

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version "${PULUMI_VERSION}"
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Check toolchain versions
        run: |
          go version
          dart --version
          node --version
          npm --version
          python --version
          uv --version

      - name: Install Dart language host
        run: |
          cd pulumi-language-dart
          go install .
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install gotestsum
        run: |
          go install gotest.tools/gotestsum@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run Dart integration tests
        shell: bash
        run: |
          set -euo pipefail
          cd integration_tests
          go test -count=1 -timeout 60m -json ./... | gotestsum --format testname

  dart-integration-tests-cloud:
    name: Dart integration tests (cloud-only)
    runs-on: ubuntu-latest
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - name: Skip cloud-only tests when 1Password token is unavailable
        if: env.OP_SERVICE_ACCOUNT_TOKEN == ''
        run: echo "Skipping cloud-only integration tests because OP_SERVICE_ACCOUNT_TOKEN is not configured."

      - name: Load cloud test secrets from 1Password
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: 1password/load-secrets-action@v2
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ env.OP_SERVICE_ACCOUNT_TOKEN }}
          PULUMI_ACCESS_TOKEN: "op://devops/pulumi token/credential"

      - name: Checkout code
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Set up Dart
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.0

      - name: Set up Node.js
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ensure pulumi submodule checkout
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        run: git submodule update --init --recursive

      - name: Install uv
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Pulumi CLI
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version "${PULUMI_VERSION}"
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Check toolchain versions
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        run: |
          go version
          dart --version
          node --version
          npm --version
          python --version
          uv --version

      - name: Install Dart language host
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        run: |
          cd pulumi-language-dart
          go install .
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install gotestsum
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        run: |
          go install gotest.tools/gotestsum@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Run cloud-only integration tests
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        shell: bash
        run: |
          set -euo pipefail
          cd integration_tests
          go test -count=1 -timeout 60m -run '^(TestEnvironmentsBasicDart|TestEnvironmentsMergeDart|TestTracePropagationDart|TestAutomationEnvironmentManagementDart|TestAutomationRemoteWorkspaceLifecycleDart|TestPolicyPublishEnableDisableDart)$' -json . | gotestsum --format testname

  check-pr:
    needs: [dart-unit-tests, proto-regeneration, website-docs, dart-integration-tests, dart-integration-tests-cloud]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Dart unit tests failed
        if: ${{ needs.dart-unit-tests.result != 'success' }}
        run: exit 1
      - name: Proto regeneration check failed
        if: ${{ needs.proto-regeneration.result != 'success' }}
        run: exit 1
      - name: Website docs build failed
        if: ${{ needs.website-docs.result != 'success' }}
        run: exit 1
      - name: Dart integration tests failed
        if: ${{ needs.dart-integration-tests.result != 'success' }}
        run: exit 1
      - name: Cloud integration tests failed
        if: ${{ needs.dart-integration-tests-cloud.result != 'success' && needs.dart-integration-tests-cloud.result != 'skipped' }}
        run: exit 1
      - name: CI succeeded
        run: exit 0
