name: Dart Language Host Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Release mode: snapshot (no publish) or release (publish GitHub Release assets)'
        required: true
        default: snapshot
        type: choice
        options:
          - snapshot
          - release
      release_tag:
        description: 'Tag to release when mode=release (for example v1.2.3)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name || github.run_id }}
  cancel-in-progress: true

env:
  PULUMI_VERSION: 3.225.1

jobs:
  release-language-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Validate release inputs
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release'
        run: |
          if [ -z "${{ github.event.inputs.release_tag }}" ]; then
            echo "release_tag is required when mode=release" >&2
            exit 1
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: 3.11.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout required Pulumi submodule
        run: git submodule update --init --depth 1 thirdparty/pulumi

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install Pulumi CLI
        run: |
          curl -fsSL https://get.pulumi.com | sh -s -- --version "${PULUMI_VERSION}"
          echo "$HOME/.pulumi/bin" >> "$GITHUB_PATH"

      - name: Install Dart language host
        run: |
          cd pulumi-language-dart
          go install .
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Install gotestsum
        run: |
          go install gotest.tools/gotestsum@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Resolve Dart workspace dependencies
        run: dart pub get

      - name: Check toolchain versions
        run: |
          go version
          dart --version
          node --version
          npm --version
          python --version
          uv --version
          pulumi version

      - name: Verify language host tests
        run: |
          cd pulumi-language-dart
          go test -count=1 ./...

      - name: Analyze pulumi core package
        run: dart analyze packages/pulumi-dart

      - name: Test pulumi core package
        run: |
          cd packages/pulumi-dart
          dart test

      - name: Run integration tests
        run: |
          python3 scripts/dart_integration_partitions.py run --parallel 1

      - name: Build release snapshot
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'snapshot'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish release assets
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'release')
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
