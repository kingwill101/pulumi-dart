name: Dart Integration

on:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dart-integration-tools:
    name: Prepare Dagger integration artifacts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.prepare.outputs.output }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go for the Dagger client
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: tool/dagger/go.sum

      - name: Compile integration tooling with Dagger
        id: prepare
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: v0.21.8
          verb: run
          workdir: tool/dagger
          args: >-
            -- go run -mod=readonly . prepare
            --source=../..
            --output=../../.dagger-ci
            --partitions=8
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          enable-github-summary: true

      - name: Upload prepared integration tooling
        uses: actions/upload-artifact@v7
        with:
          name: dart-integration-tools
          path: .dagger-ci
          if-no-files-found: error
          include-hidden-files: true

  dart-integration-tests:
    name: Dart integration (core ${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: dart-integration-tools
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.dart-integration-tools.outputs.matrix) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go for the Dagger client
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: tool/dagger/go.sum

      - name: Download prepared integration tooling
        uses: actions/download-artifact@v8
        with:
          name: dart-integration-tools
          path: .dagger-ci

      - name: Run the integration partition with Dagger
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: v0.21.8
          verb: run
          workdir: tool/dagger
          args: >-
            -- go run -mod=readonly . integration
            --source=../..
            --artifacts=../../.dagger-ci
            --tests=${{ matrix.testsCsv }}
            --timeout=60m
            --parallel=4
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          enable-github-summary: true

  dart-integration-tests-cloud:
    name: Dart integration (cloud-only)
    runs-on: ubuntu-latest
    needs: dart-integration-tools
    timeout-minutes: 60
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - name: Load cloud test secrets from 1Password
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ env.OP_SERVICE_ACCOUNT_TOKEN }}
          PULUMI_ACCESS_TOKEN: "op://devops/pulumi token/credential"

      - name: Checkout code
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: actions/checkout@v7

      - name: Set up Go for the Dagger client
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: tool/dagger/go.sum

      - name: Download prepared integration tooling
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: actions/download-artifact@v8
        with:
          name: dart-integration-tools
          path: .dagger-ci

      - name: Run cloud integration tests with Dagger
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: v0.21.8
          verb: run
          workdir: tool/dagger
          args: >-
            -- go run -mod=readonly . integration
            --source=../..
            --artifacts=../../.dagger-ci
            --tests=TestEnvironmentsBasicDart,TestEnvironmentsMergeDart,TestTracePropagationDart,TestAutomationEnvironmentManagementDart,TestAutomationRemoteWorkspaceLifecycleDart,TestPolicyPublishEnableDisableDart
            --timeout=60m
            --parallel=4
            --cloud
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
          enable-github-summary: true

  check-integration:
    name: check-integration
    if: always()
    runs-on: ubuntu-latest
    needs:
      - dart-integration-tools
      - dart-integration-tests
      - dart-integration-tests-cloud
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go for the Dagger client
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache-dependency-path: tool/dagger/go.sum

      - name: Verify integration job results
        uses: dagger/dagger-for-github@v8.4.1
        with:
          version: v0.21.8
          verb: run
          workdir: tool/dagger
          args: >-
            -- go run -mod=readonly . status
            --prepare=${{ needs.dart-integration-tools.result }}
            --core=${{ needs.dart-integration-tests.result }}
            --cloud=${{ needs.dart-integration-tests-cloud.result }}
          cloud-token: ${{ secrets.DAGGER_CLOUD_TOKEN }}
