name: Dart Integration

on:
  workflow_dispatch:
  merge_group:
  pull_request:
    paths:
      - ".github/workflows/dart-integration.yml"
      - "devenv.lock"
      - "devenv.nix"
      - "devenv.yaml"
      - "integration_tests/**"
      - "packages/pulumi-dart/**"
      - "pulumi-language-dart/**"
      - "repodoc/bin/repodoc_integration.dart"
      - "repodoc/lib/src/commands/integration/**"
      - "repodoc/lib/src/integration_runner.dart"
      - "repodoc/pubspec.yaml"
      - "pubspec.lock"
      - "pubspec.yaml"
      - "thirdparty/pulumi"
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PULUMI_SKIP_UPDATE_CHECK: "true"
  PULUMI_CONFIG_PASSPHRASE: pulumi-dart-test-passphrase

jobs:
  prepare:
    name: Prepare integration artifacts
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Prepare host, tests, matrix, and prewarmed kernels
        run: devenv shell --no-eval-cache -- integration-ci-prepare
      - name: Export test matrix
        id: matrix
        run: echo "matrix=$(tr -d '\n' < .integration-ci/matrix.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: dart-integration-tools
          path: .integration-ci
          if-no-files-found: error
          include-hidden-files: true

  core:
    name: Dart integration (core ${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      # The policy-plugin integration coverage invokes npm and Node directly.
      # Keep Node outside the Nix shell so unrelated Dart jobs do not evaluate
      # nixpkgs' platform-specific Node codesigning patches.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - uses: actions/download-artifact@v8
        with:
          name: dart-integration-tools
          path: .integration-ci
      - name: Run integration partition
        env:
          INTEGRATION_TESTS: ${{ matrix.testsCsv }}
          INTEGRATION_TIMEOUT: 60m
          INTEGRATION_PARALLEL: 4
        run: devenv shell --no-eval-cache -- integration-ci-run

  cloud:
    name: Dart integration (cloud-only)
    runs-on: ubuntu-latest
    needs: prepare
    timeout-minutes: 60
    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
    steps:
      - name: Load cloud test secrets from 1Password
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        uses: 1password/load-secrets-action@v4
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ env.OP_SERVICE_ACCOUNT_TOKEN }}
          PULUMI_ACCESS_TOKEN: "op://devops/pulumi token/credential"
      - uses: actions/checkout@v7
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
      - uses: cachix/cachix-action@v16
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        with:
          name: devenv
      - name: Install devenv
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        run: nix profile add nixpkgs#devenv
      - uses: actions/download-artifact@v8
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        with:
          name: dart-integration-tools
          path: .integration-ci
      - name: Run cloud integration tests
        if: env.OP_SERVICE_ACCOUNT_TOKEN != ''
        env:
          INTEGRATION_TESTS: TestEnvironmentsBasicDart,TestEnvironmentsMergeDart,TestTracePropagationDart,TestAutomationEnvironmentManagementDart,TestAutomationRemoteWorkspaceLifecycleDart,TestPolicyPublishEnableDisableDart
          INTEGRATION_TIMEOUT: 60m
          INTEGRATION_PARALLEL: 4
        run: devenv shell --no-eval-cache -- integration-ci-run

  language-host-unit:
    name: Language host unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Test language host runtime
        run: devenv shell --no-eval-cache -- language-host-unit-test

  language-codegen:
    name: Language codegen tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Test language codegen
        run: devenv shell --no-eval-cache -- language-codegen-test

  language-conformance:
    name: Language conformance (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Run conformance shard
        env:
          PULUMI_DART_CONFORMANCE_SHARD: ${{ matrix.shard }}/8
          PULUMI_DART_CONFORMANCE_CASE_TIMEOUT: 5m
        run: devenv shell --no-eval-cache -- language-conformance-test

  check-integration:
    name: check-integration
    if: always()
    runs-on: ubuntu-latest
    needs: [prepare, core, cloud, language-host-unit, language-codegen, language-conformance]
    steps:
      - name: Verify integration job results
        env:
          PREPARE_RESULT: ${{ needs.prepare.result }}
          CORE_RESULT: ${{ needs.core.result }}
          CLOUD_RESULT: ${{ needs.cloud.result }}
          HOST_UNIT_RESULT: ${{ needs.language-host-unit.result }}
          CODEGEN_RESULT: ${{ needs.language-codegen.result }}
          CONFORMANCE_RESULT: ${{ needs.language-conformance.result }}
        run: |
          test "$PREPARE_RESULT" = success
          test "$CORE_RESULT" = success
          test "$CLOUD_RESULT" = success || test "$CLOUD_RESULT" = skipped
          test "$HOST_UNIT_RESULT" = success
          test "$CODEGEN_RESULT" = success
          test "$CONFORMANCE_RESULT" = success
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: devenv
      - name: Install devenv
        run: nix profile add nixpkgs#devenv
      - name: Analyze and test Dart SDK package
        run: >-
          devenv shell --no-eval-cache -- bash -lc
          'cd packages/pulumi-dart && dart pub get && dart analyze && dart test'
