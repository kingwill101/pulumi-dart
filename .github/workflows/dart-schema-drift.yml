name: Dart Provider Schema Drift

on:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * *"
  pull_request:
    paths:
      - .github/workflows/dart-schema-drift.yml
      - repodoc/lib/src/commands/schema/**
      - packages/sdks/schema_sources.json
      - packages/sdks/schemas/*.schema.json

permissions:
  contents: read

jobs:
  prepare-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: matrix
        name: Build provider matrix
        run: |
          set -euo pipefail
          MATRIX_JSON="$(jq -c '{provider: [.providers[].name]}' packages/sdks/schema_sources.json)"
          echo "matrix=${MATRIX_JSON}" >> "$GITHUB_OUTPUT"

  schema-drift:
    name: schema drift - ${{ matrix.provider }}
    needs: prepare-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Run drift check
        id: drift
        run: |
          set -euo pipefail
          REPORT_PATH="schema-drift-${{ matrix.provider }}.json"
          dart run repodoc schema:check --provider "${{ matrix.provider }}" --json --pretty > "${REPORT_PATH}"
          cat "${REPORT_PATH}"

          echo "report_path=${REPORT_PATH}" >> "$GITHUB_OUTPUT"
          echo "drift=$(jq -r '.drift' "${REPORT_PATH}")" >> "$GITHUB_OUTPUT"
          echo "local_schema_version=$(jq -r '.local_schema_version' "${REPORT_PATH}")" >> "$GITHUB_OUTPUT"
          echo "upstream_version=$(jq -r '.upstream_version' "${REPORT_PATH}")" >> "$GITHUB_OUTPUT"
          echo "upstream_version_source=$(jq -r '.upstream_version_source' "${REPORT_PATH}")" >> "$GITHUB_OUTPUT"
          echo "schema_source=$(jq -r '.schema_source' "${REPORT_PATH}")" >> "$GITHUB_OUTPUT"
          echo "package_version=$(jq -r '.package_version' "${REPORT_PATH}")" >> "$GITHUB_OUTPUT"
          echo "upstream_version_changed=$(jq -r '.upstream_version_changed' "${REPORT_PATH}")" >> "$GITHUB_OUTPUT"
          echo "upstream_checksum_changed=$(jq -r '.upstream_checksum_changed' "${REPORT_PATH}")" >> "$GITHUB_OUTPUT"
          echo "package_version_matches_local_schema=$(jq -r '.package_version_matches_local_schema' "${REPORT_PATH}")" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        run: |
          {
            echo "### Schema Drift - ${{ matrix.provider }}"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Local schema version | \`${{ steps.drift.outputs.local_schema_version }}\` |"
            echo "| Upstream version | \`${{ steps.drift.outputs.upstream_version }}\` |"
            echo "| Upstream version source | \`${{ steps.drift.outputs.upstream_version_source }}\` |"
            echo "| Schema content source | \`${{ steps.drift.outputs.schema_source }}\` |"
            echo "| Generated package version | \`${{ steps.drift.outputs.package_version }}\` |"
            echo "| Upstream version changed | \`${{ steps.drift.outputs.upstream_version_changed }}\` |"
            echo "| Upstream checksum changed | \`${{ steps.drift.outputs.upstream_checksum_changed }}\` |"
            echo "| Package version matches local schema | \`${{ steps.drift.outputs.package_version_matches_local_schema }}\` |"
            echo "| Drift detected | \`${{ steps.drift.outputs.drift }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload JSON report
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-${{ matrix.provider }}
          path: ${{ steps.drift.outputs.report_path }}

      - name: Fail when drift is detected
        if: steps.drift.outputs.drift == 'true'
        run: |
          echo "Upstream schema drift detected for provider '${{ matrix.provider }}'."
          echo "Regenerate this provider package with the latest schema and commit updates."
          exit 1
