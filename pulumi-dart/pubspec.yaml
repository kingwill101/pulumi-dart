name: pulumi
description: Pulumi core SDK for Dart infrastructure as code programs.
version: 0.0.1-dev
homepage: https://www.pulumi.com
repository: https://github.com/kingwill101/pulumi-dart/tree/master/pulumi-dart
issue_tracker: https://github.com/kingwill101/pulumi-dart/issues

environment:
  sdk: ">=3.10.0 <4.0.0"

# Add regular dependencies here.
dependencies:
  fixnum: ^1.1.1
  grpc: ^5.1.0
  protobuf: ^6.0.0
  uuid: ^4.5.3

  meta: ^1.18.1
  path: ^1.9.1
  build: ^4.0.4
  source_gen: ^4.2.0
  analyzer: ^8.4.1
dev_dependencies:
  lints: ^6.1.0
  test: ^1.30.0
  mockito: ^5.6.3
  dart_code_linter: ^3.2.1
  build_runner: ^2.11.1
  mutation_test: ^1.8.0

executables:
  pulumi-dart: pulumi_dart
