name: pulumi_dart_faas
description: Dart-first FaaS package for Pulumi with shared source models and AWS/GCP adapters.
version: 0.1.0
license: Apache-2.0
homepage: https://www.pulumi.com
repository: https://github.com/kingwill101/pulumi-dart/tree/master/packages/pulumi-dart-faas
resolution: workspace

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  pulumi: ^3.0.0
  pulumi_command: ^1.2.1
  pulumi_aws: ^7.20.0
  pulumi_awsx: ^3.2.1
  pulumi_docker_build: ^0.0.22
  pulumi_gcp: ^9.11.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.30.0
